<div class="ui">
    <input type="text" id="userName" placeholder="اسمك">
    <video id="view" autoplay muted playsinline></video>
    <button onclick="flip()">🔄 تبديل الكاميرا</button>
    <button id="recBtn" onclick="startRec()">🔴 تسجيل 10 ثوانٍ</button>
</div>

<script>
    let mode = "user"; 
    let chunks = [];
    let recorder;

    async function init(m) {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: m, width: 640, height: 480 }, // ضغط الأبعاد لسرعة الرفع
            audio: true
        });
        document.getElementById('view').srcObject = stream;
        // تقليل الجودة لضمان سرعة الرفع لـ 200 طالب
        recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8', bitsPerSecond: 1000000 }); 
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = upload;
    }

    function flip() {
        mode = mode === "user" ? "environment" : "user";
        init(mode);
    }

    function startRec() {
        chunks = [];
        recorder.start();
        setTimeout(() => recorder.stop(), 10000);
    }

    async function upload() {
        const blob = new Blob(chunks, {type: 'video/mp4'});
        const fd = new FormData();
        fd.append('video', blob);
        fd.append('name', document.getElementById('userName').value);
        await fetch("https://candy-stardust-kilt.ngrok-free.dev", { method: 'POST', body: fd });
        alert("تم الإرسال!");
    }
    init(mode);
</script>
