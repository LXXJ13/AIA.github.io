<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VidStream - Record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080810;
  --card: #10101c;
  --border: #1c1c2e;
  --accent: #ff3c5f;
  --accent2: #ff8c42;
  --green: #00e5a0;
  --text: #eeeef8;
  --muted: #4a4a64;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', system-ui, sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
}

header {
  width: 100%;
  max-width: 640px;
  padding: 20px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-family: 'Bebas Neue', Impact, sans-serif;
  font-size: 24px;
  letter-spacing: 4px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.badge {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  border: 1px solid var(--border);
  padding: 4px 12px;
  border-radius: 99px;
}

main {
  width: 100%;
  max-width: 640px;
  padding: 0 16px 48px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}

/* ── Name input ── */
.name-row {
  width: 100%;
  position: relative;
}

.name-row label {
  position: absolute;
  top: -9px;
  left: 12px;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  background: var(--bg);
  padding: 0 4px;
}

.name-row input {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: 'DM Sans', system-ui, sans-serif;
  font-size: 15px;
  font-weight: 500;
  padding: 14px 16px;
  outline: none;
  transition: border-color 0.2s;
}

.name-row input:focus {
  border-color: var(--accent);
}

.name-row input::placeholder {
  color: var(--muted);
}

/* ── Camera shell ── */
.camera-shell {
  width: 100%;
  position: relative;
  border-radius: 20px;
  overflow: hidden;
  background: var(--card);
  border: 1px solid var(--border);
  aspect-ratio: 16 / 9;
  box-shadow: 0 0 60px rgba(255, 60, 95, 0.07);
}

#preview {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transform: scaleX(-1);
  transition: transform 0.3s ease;
}

#preview.rear {
  transform: scaleX(1);
}

/* ── No camera placeholder ── */
.no-cam {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: var(--muted);
}

.no-cam svg {
  width: 48px;
  height: 48px;
  opacity: 0.3;
}

.no-cam p {
  font-size: 14px;
}

/* ── Countdown ring ── */
.ring-wrap {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.ring-wrap.active {
  display: flex;
}

.ring {
  width: 90px;
  height: 90px;
  position: relative;
}

.ring svg {
  position: absolute;
  inset: 0;
  transform: rotate(-90deg);
}

.ring-track {
  stroke: rgba(255, 255, 255, 0.1);
}

.ring-fill {
  stroke: var(--accent);
  stroke-dasharray: 251.2;
  stroke-dashoffset: 0;
  transition: stroke-dashoffset 1s linear;
}

.ring-num {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Bebas Neue', Impact, sans-serif;
  font-size: 36px;
  color: #fff;
}

.rec-dot {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--accent);
}

.rec-dot::before {
  content: '';
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent);
  animation: blink 1s ease-in-out infinite;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.2; }
}

/* ── Status bar ── */
.status-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 10px 14px;
  background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.status-text {
  font-size: 12px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.5);
}

#connStatus {
  font-size: 11px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
}

#connStatus.ok {
  color: var(--green);
}

/* ── Flip button ── */
.flip-btn {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.15);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}

.flip-btn:hover {
  background: rgba(255, 255, 255, 0.2);
}

.flip-btn svg {
  width: 18px;
  height: 18px;
  fill: none;
  stroke: #fff;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ── Controls row ── */
.controls {
  width: 100%;
  display: flex;
  gap: 12px;
}

.btn-record {
  flex: 1;
  height: 56px;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  font-family: 'Bebas Neue', Impact, sans-serif;
  font-size: 20px;
  letter-spacing: 3px;
  background: linear-gradient(135deg, var(--accent), #c0283f);
  color: #fff;
  box-shadow: 0 4px 24px rgba(255, 60, 95, 0.35);
  transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
}

.btn-record:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(255, 60, 95, 0.45);
}

.btn-record:active:not(:disabled) {
  transform: translateY(0);
}

.btn-record:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.btn-cam {
  width: 56px;
  height: 56px;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}

.btn-cam:hover {
  background: #1a1a2a;
}

.btn-cam svg {
  width: 22px;
  height: 22px;
}

/* ── Upload progress ── */
.upload-bar {
  width: 100%;
  height: 4px;
  border-radius: 99px;
  background: var(--border);
  overflow: hidden;
  display: none;
}

.upload-bar.active {
  display: block;
}

.upload-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 99px;
  transition: width 0.3s ease;
}

/* ── Tips ── */
.tips {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.tips-title {
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
}

.tip {
  font-size: 13px;
  color: rgba(238, 238, 248, 0.6);
  display: flex;
  align-items: center;
  gap: 8px;
}

.tip-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 20px;
  font-size: 14px;
  font-weight: 500;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
  opacity: 0;
  z-index: 200;
  white-space: nowrap;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

.toast.success {
  border-color: var(--green);
  color: var(--green);
}

.toast.error {
  border-color: var(--accent);
  color: var(--accent);
}
</style>
</head>
<body>

<header>
  <span class="logo">VIDSTREAM</span>
  <span class="badge">Recorder</span>
</header>

<main>

  <div class="name-row">
    <label for="senderName">Your Name</label>
    <input type="text" id="senderName" placeholder="Enter your name..." maxlength="32">
  </div>

  <div class="camera-shell">

    <video id="preview" autoplay muted playsinline></video>

    <div class="no-cam" id="noCam">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 10l4.553-2.276A1 1 0 0121 8.723v6.554a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h10a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"></path>
        <line x1="3" y1="3" x2="21" y2="21" stroke-width="1.5"></line>
      </svg>
      <p>Tap Record to start camera</p>
    </div>

    <div class="ring-wrap" id="ringWrap">
      <div class="ring">
        <svg viewBox="0 0 90 90" width="90" height="90">
          <circle class="ring-track" cx="45" cy="45" r="40" fill="none" stroke-width="6"></circle>
          <circle class="ring-fill" id="ringFill" cx="45" cy="45" r="40" fill="none" stroke-width="6" stroke-linecap="round"></circle>
        </svg>
        <div class="ring-num" id="ringNum">10</div>
      </div>
      <div class="rec-dot">REC</div>
    </div>

    <button class="flip-btn" title="Mirror camera" onclick="flipCamera()">
      <svg viewBox="0 0 24 24">
        <path d="M1 4v6h6"></path>
        <path d="M23 20v-6h-6"></path>
        <path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"></path>
      </svg>
    </button>

    <div class="status-bar">
      <span class="status-text" id="statusText">Ready</span>
      <span id="connStatus">Checking...</span>
    </div>

  </div>

  <div class="upload-bar" id="uploadBar">
    <div class="upload-fill" id="uploadFill"></div>
  </div>

  <div class="controls">
    <button class="btn-record" id="recordBtn" onclick="startRecording()">&#9679; REC 10s</button>
    <button class="btn-cam" title="Switch front/rear camera" onclick="switchCamera()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
    </button>
  </div>

  <div class="tips">
    <div class="tips-title">How it works</div>
    <div class="tip"><div class="tip-dot"></div>Enter your name so the dashboard knows who sent the clip</div>
    <div class="tip"><div class="tip-dot"></div>Hit REC &mdash; recording stops automatically after 10 seconds</div>
    <div class="tip"><div class="tip-dot"></div>Video is compressed and sent instantly</div>
    <div class="tip"><div class="tip-dot"></div>Multiple people can record and send at the same time</div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
// =========================================================
// CONFIG — replace with your ngrok URL each session
// =========================================================
var SERVER_URL = "https://YOUR-NGROK-URL.ngrok-free.app";
// =========================================================

var stream = null;
var mediaRecorder = null;
var chunks = [];
var countdownTimer = null;
var facingMode = "user";
var isMirrored = true;
var isRecording = false;

var MAX_DURATION = 10;
var CIRCUMFERENCE = 2 * Math.PI * 40;

window.addEventListener("load", function() {
  var saved = localStorage.getItem("vidstream_name");
  if (saved) document.getElementById("senderName").value = saved;
  checkServer();
  startCamera();
});

function checkServer() {
  var el = document.getElementById("connStatus");
  el.textContent = "Checking...";
  el.className = "";
  fetch(SERVER_URL + "/videos", { signal: AbortSignal.timeout(5000) })
    .then(function(r) {
      if (r.ok) { el.textContent = "Connected"; el.className = "ok"; }
      else throw new Error();
    })
    .catch(function() {
      el.textContent = "Server offline";
      el.className = "";
    });
}

function startCamera() {
  if (stream) stream.getTracks().forEach(function(t) { t.stop(); });
  navigator.mediaDevices.getUserMedia({
    video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: true
  }).then(function(s) {
    stream = s;
    var preview = document.getElementById("preview");
    preview.srcObject = stream;
    document.getElementById("noCam").style.display = "none";
    setStatus("Camera ready");
  }).catch(function() {
    setStatus("Camera denied");
    showToast("Camera access denied", "error");
  });
}

function flipCamera() {
  isMirrored = !isMirrored;
  var preview = document.getElementById("preview");
  if (isMirrored) {
    preview.classList.remove("rear");
  } else {
    preview.classList.add("rear");
  }
}

function switchCamera() {
  facingMode = facingMode === "user" ? "environment" : "user";
  isMirrored = facingMode === "user";
  startCamera();
}

function getBestMime() {
  var types = [
    "video/webm;codecs=vp9,opus",
    "video/webm;codecs=vp8,opus",
    "video/webm",
    "video/mp4"
  ];
  for (var i = 0; i < types.length; i++) {
    if (MediaRecorder.isTypeSupported(types[i])) return types[i];
  }
  return "";
}

function startRecording() {
  if (isRecording) return;
  if (!stream) {
    startCamera();
    showToast("Starting camera, try again in a moment", "error");
    return;
  }

  var name = document.getElementById("senderName").value.trim() || "Anonymous";
  localStorage.setItem("vidstream_name", name);

  isRecording = true;
  chunks = [];

  var mimeType = getBestMime();
  var options = { videoBitsPerSecond: 800000 };
  if (mimeType) options.mimeType = mimeType;

  try {
    mediaRecorder = new MediaRecorder(stream, options);
  } catch(e) {
    mediaRecorder = new MediaRecorder(stream);
    mimeType = "";
  }

  mediaRecorder.ondataavailable = function(e) {
    if (e.data && e.data.size > 0) chunks.push(e.data);
  };

  mediaRecorder.onstop = function() {
    uploadVideo(mimeType || "video/webm", name);
  };

  mediaRecorder.start(500);

  document.getElementById("recordBtn").disabled = true;
  document.getElementById("recordBtn").textContent = "RECORDING...";
  document.getElementById("ringWrap").classList.add("active");
  startCountdown();
}

function startCountdown() {
  var remaining = MAX_DURATION;
  var numEl = document.getElementById("ringNum");
  var fillEl = document.getElementById("ringFill");
  fillEl.style.strokeDashoffset = 0;

  function tick() {
    numEl.textContent = remaining;
    var progress = (MAX_DURATION - remaining) / MAX_DURATION;
    fillEl.style.strokeDashoffset = CIRCUMFERENCE * progress;
    setStatus("Recording... " + remaining + "s left");
    if (remaining <= 0) {
      stopRecording();
      return;
    }
    remaining--;
    countdownTimer = setTimeout(tick, 1000);
  }
  tick();
}

function stopRecording() {
  clearTimeout(countdownTimer);
  if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  document.getElementById("ringWrap").classList.remove("active");
  document.getElementById("recordBtn").textContent = "UPLOADING...";
  setStatus("Uploading...");
}

function uploadVideo(mimeType, senderName) {
  var blob = new Blob(chunks, { type: mimeType });
  var bar = document.getElementById("uploadBar");
  var fill = document.getElementById("uploadFill");
  bar.classList.add("active");

  var xhr = new XMLHttpRequest();
  xhr.open("POST", SERVER_URL + "/upload");
  xhr.setRequestHeader("X-Sender-Name", encodeURIComponent(senderName));
  xhr.setRequestHeader("X-Mime-Type", mimeType);
  xhr.setRequestHeader("Content-Type", "application/octet-stream");

  xhr.upload.onprogress = function(e) {
    if (e.lengthComputable) {
      fill.style.width = ((e.loaded / e.total) * 100) + "%";
    }
  };

  xhr.onload = function() {
    bar.classList.remove("active");
    fill.style.width = "0%";
    isRecording = false;
    document.getElementById("recordBtn").disabled = false;
    document.getElementById("recordBtn").textContent = "\u25CF REC 10s";
    if (xhr.status === 200) {
      setStatus("Sent!");
      showToast("Clip sent!", "success");
    } else {
      setStatus("Upload failed");
      showToast("Upload failed - is the server running?", "error");
    }
    setTimeout(function() { setStatus("Camera ready"); }, 3000);
  };

  xhr.onerror = function() {
    bar.classList.remove("active");
    fill.style.width = "0%";
    isRecording = false;
    document.getElementById("recordBtn").disabled = false;
    document.getElementById("recordBtn").textContent = "\u25CF REC 10s";
    setStatus("Upload failed");
    showToast("Cannot reach server - check ngrok URL", "error");
  };

  xhr.send(blob);
}

function setStatus(text) {
  document.getElementById("statusText").textContent = text;
}

var toastTimer = null;
function showToast(msg, type) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast " + (type || "") + " show";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() {
    t.className = "toast " + (type || "");
  }, 3000);
}
</script>
</body>
</html>
