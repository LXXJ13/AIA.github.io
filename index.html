<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل فيديو المدرسة</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; background: #f0f2f5; }
        .box { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        video { width: 100%; border-radius: 10px; background: #000; margin: 10px 0; }
        .btn { background: #007bff; color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; cursor: pointer; font-size: 18px; }
        input { width: 90%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🎥 شاركنا الآن</h2>
        <input type="text" id="name" placeholder="ادخل اسمك هنا">
        <video id="preview" autoplay muted playsinline></video>
        <button id="btn" class="btn">بدأ التسجيل (10 ثوانٍ)</button>
        <p id="msg"></p>
    </div>

    <script>
        const SERVER_URL = https://heavy-years-listen.loca.lt; 
        let mediaRecorder, chunks = [];

        navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(s => {
            document.getElementById('preview').srcObject = s;
            mediaRecorder = new MediaRecorder(s);
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = upload;
        });

        document.getElementById('btn').onclick = () => {
            if(!document.getElementById('name').value) return alert("اكتب اسمك!");
            chunks = [];
            mediaRecorder.start();
            document.getElementById('btn').disabled = true;
            document.getElementById('btn').innerText = "جاري التسجيل... ⏳";
            setTimeout(() => mediaRecorder.stop(), 10000);
        };

        async function upload() {
            document.getElementById('msg').innerText = "جاري الرفع... 🚀";
            const fd = new FormData();
            fd.append('video', new Blob(chunks, {type:'video/mp4'}));
            fd.append('name', document.getElementById('name').value);

            await fetch(`${SERVER_URL}/upload`, { method: 'POST', body: fd });
            document.getElementById('msg').innerText = "تم الإرسال بنجاح! ✅";
            document.getElementById('btn').disabled = false;
            document.getElementById('btn').innerText = "تسجيل فيديو آخر؟";
        }
    </script>
</body>
</html>
