<video id="v" autoplay muted playsinline style="width:100%; border-radius:15px;"></video>
<button id="btn" onclick="start()">🔴 ابدأ تسجيل 10 ثوانٍ</button>

<script>
    const NGROK_URL = "https://candy-stardust-kilt.ngrok-free.dev";
    let recorder, chunks = [];

    async function setup() {
        const stream = await navigator.mediaDevices.getUserMedia({ 
            video: { width: 480, height: 640, facingMode: "user" }, 
            audio: true 
        });
        document.getElementById('v').srcObject = stream;
        recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8', bitsPerSecond: 800000 });
        recorder.ondataavailable = e => chunks.push(e.data);
        recorder.onstop = send;
    }

    function start() {
        chunks = [];
        recorder.start();
        document.getElementById('btn').innerText = "جاري التسجيل...";
        setTimeout(() => recorder.stop(), 10000);
    }

    async function send() {
        const blob = new Blob(chunks, { type: 'video/mp4' });
        const fd = new FormData();
        fd.append('video', blob, 'video.mp4');
        fd.append('name', prompt("أدخل اسمك:"));
        
        await fetch(`${NGROK_URL}/upload`, { method: 'POST', body: fd });
        alert("وصل فيديو المشاركة، شكراً لك!");
        document.getElementById('btn').innerText = "🔴 سجل مرة أخرى";
    }
    setup();
</script>
