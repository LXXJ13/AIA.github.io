<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>فيد ستريم — تسجيل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080810;
  --card: #10101c;
  --border: #1c1c2e;
  --border2: #252538;
  --accent: #ff3c5f;
  --accent2: #ff8c42;
  --green: #00e5a0;
  --blue: #4e8cff;
  --text: #eeeef8;
  --muted: #4a4a64;
  --muted2: #666680;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Tajawal', sans-serif;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

/* ── Header ── */
header {
  width: 100%;
  max-width: 480px;
  padding: 18px 20px 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 4px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.badge {
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  border: 1px solid var(--border2);
  padding: 4px 12px;
  border-radius: 99px;
}

/* ── Main ── */
main {
  width: 100%;
  max-width: 480px;
  padding: 0 14px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}

/* ── Name input ── */
.name-row {
  width: 100%;
  position: relative;
}

.name-row label {
  position: absolute;
  top: -9px;
  right: 12px;
  font-size: 10px;
  letter-spacing: 1.5px;
  color: var(--muted);
  background: var(--bg);
  padding: 0 4px;
}

.name-row input {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  color: var(--text);
  font-family: 'Tajawal', sans-serif;
  font-size: 16px;
  font-weight: 500;
  padding: 14px 16px;
  outline: none;
  transition: border-color 0.2s;
  -webkit-appearance: none;
}

.name-row input:focus { border-color: var(--accent); }
.name-row input::placeholder { color: var(--muted); }



/* ── Camera shell ── */
.camera-shell {
  width: 100%;
  position: relative;
  border-radius: 20px;
  overflow: hidden;
  background: var(--card);
  border: 1px solid var(--border);
  aspect-ratio: 9 / 16;
  box-shadow: 0 0 60px rgba(255, 60, 95, 0.07);
 }

/* -- Camera shell -- */
#preview {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  /* إزالة أي تحويل افتراضي من هنا */
  transition: transform 0.3s ease;
}

/* الكاميرا الأمامية فقط هي التي تنعكس (مثل السيلفي) */
#preview.user {
  transform: scaleX(-1);
}

/* الكاميرا الخلفية تظهر بشكل طبيعي */
#preview.environment {
  transform: scaleX(1);
}

/* No camera placeholder */
.no-cam {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px;
  color: var(--muted);
}
.no-cam svg { width: 44px; height: 44px; opacity: 0.3; }
.no-cam p { font-size: 14px; }

/* ── Countdown ring ── */
.ring-wrap {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  display: none; flex-direction: column;
  align-items: center; gap: 8px;
  pointer-events: none;
}
.ring-wrap.active { display: flex; }

.ring { width: 90px; height: 90px; position: relative; }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring-track { stroke: rgba(255,255,255,0.1); }
.ring-fill {
  stroke: var(--accent);
  stroke-dasharray: 251.2;
  stroke-dashoffset: 0;
  transition: stroke-dashoffset 1s linear;
}
.ring-num {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: #fff;
}

.rec-dot {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; letter-spacing: 2px;
  color: var(--accent); font-family: 'Tajawal', sans-serif;
}
.rec-dot::before {
  content: ''; width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent); animation: blink 1s ease-in-out infinite;
}
@keyframes blink { 0%,100%{opacity:1}50%{opacity:0.2} }



/* Status bar */
.status-bar {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 10px 14px;
  background: linear-gradient(transparent, rgba(0,0,0,0.7));
  display: flex; align-items: center; justify-content: space-between;
}
.status-text {
  font-size: 12px; color: rgba(255,255,255,0.55);
}
#connStatus {
  font-size: 11px; color: var(--muted);
  display: flex; align-items: center; gap: 5px;
}
#connStatus::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%;
  background: var(--muted);
  transition: background 0.3s;
}
#connStatus.ok { color: var(--green); }
#connStatus.ok::before { background: var(--green); box-shadow: 0 0 6px var(--green); }
#connStatus.err::before { background: var(--accent); }

/* ── Upload progress ── */
.upload-bar {
  width: 100%; height: 5px;
  border-radius: 99px;
  background: var(--border);
  overflow: hidden; display: none;
  position: relative;
}
.upload-bar.active { display: block; }
.upload-fill {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 99px;
  transition: width 0.25s ease;
}
/* Indeterminate animation for retry */
.upload-bar.retry .upload-fill {
  width: 100% !important;
  animation: shimmer 1.2s infinite;
  background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent));
  background-size: 200%;
}
@keyframes shimmer { 0%{background-position:100%}100%{background-position:-100%} }

/* ── Controls ── */
.controls {
  width: 100%;
  display: flex;
  gap: 10px;
}

.btn-record {
  flex: 1; height: 58px;
  border: none; border-radius: 16px; cursor: pointer;
  font-family: 'Tajawal', sans-serif; font-size: 19px; font-weight: 700;
  background: linear-gradient(135deg, var(--accent), #c0283f);
  color: #fff;
  box-shadow: 0 4px 24px rgba(255,60,95,0.35);
  transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
  letter-spacing: 0.5px;
}
.btn-record:active:not(:disabled) { transform: scale(0.97); }
.btn-record:disabled { opacity: 0.45; cursor: not-allowed; }

.btn-cam {
  width: 58px; height: 58px; flex-shrink: 0;
  border: none; border-radius: 16px; cursor: pointer;
  background: var(--card); border: 1px solid var(--border2);
  color: var(--text);
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.btn-cam:active { background: var(--border2); }
.btn-cam svg { width: 22px; height: 22px; }

/* ── Retry status ── */
.retry-info {
  width: 100%;
  text-align: center;
  font-size: 12px;
  color: var(--muted2);
  display: none;
  gap: 6px;
  align-items: center;
  justify-content: center;
}
.retry-info.show { display: flex; }

/* ── Tips ── */
.tips {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px 18px;
  display: flex; flex-direction: column; gap: 10px;
}
.tips-title {
  font-size: 11px; font-weight: 700;
  color: var(--muted); margin-bottom: 2px;
}
.tip {
  font-size: 13px;
  color: rgba(238,238,248,0.6);
  display: flex; align-items: flex-start; gap: 10px;
  line-height: 1.5;
}
.tip-dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--accent); flex-shrink: 0; margin-top: 6px;
}

/* ── Toast ── */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 12px 20px;
  font-family: 'Tajawal', sans-serif;
  font-size: 14px; font-weight: 500;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
  opacity: 0; z-index: 200; white-space: nowrap;
  max-width: calc(100vw - 32px);
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.success { border-color: var(--green); color: var(--green); }
.toast.error   { border-color: var(--accent); color: var(--accent); }
.toast.info    { border-color: var(--blue);   color: var(--blue); }
</style>
</head>
<body>

<header>
  <span class="logo">VIDSTREAM</span>
  <span class="badge">تسجيل</span>
</header>

<main>

  <!-- Name -->
  <div class="name-row">
    <label for="senderName">اسمك</label>
    <input type="text" id="senderName" placeholder="أدخل اسمك..." maxlength="40"
           autocomplete="name" autocorrect="off" autocapitalize="words">
  </div>

  <!-- Camera -->
  <div class="camera-shell">
    <video id="preview" autoplay muted playsinline></video>

    <div class="no-cam" id="noCam">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M15 10l4.553-2.276A1 1 0 0121 8.723v6.554a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h10a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
        <line x1="3" y1="3" x2="21" y2="21" stroke-width="1.5"/>
      </svg>
      <p>اضغط تسجيل لتشغيل الكاميرا</p>
    </div>

    <div class="ring-wrap" id="ringWrap">
      <div class="ring">
        <svg viewBox="0 0 90 90" width="90" height="90">
          <circle class="ring-track" cx="45" cy="45" r="40" fill="none" stroke-width="6"/>
          <circle class="ring-fill" id="ringFill" cx="45" cy="45" r="40" fill="none" stroke-width="6" stroke-linecap="round"/>
        </svg>
        <div class="ring-num" id="ringNum">10</div>
      </div>
      <div class="rec-dot">تسجيل</div>
    </div>



    <div class="status-bar">
      <span class="status-text" id="statusText">جاهز</span>
      <span id="connStatus">يتحقق…</span>
    </div>
  </div>

  <!-- Upload progress -->
  <div class="upload-bar" id="uploadBar">
    <div class="upload-fill" id="uploadFill"></div>
  </div>

  <!-- Retry info -->
  <div class="retry-info" id="retryInfo">
    <span id="retryText">جارٍ إعادة المحاولة…</span>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn-record" id="recordBtn" onclick="startRecording()">⏺ تسجيل ١٠ ث</button>
    <button class="btn-cam" title="تبديل الكاميرا" onclick="switchCamera()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </button>
  </div>

  <!-- Tips -->
  <div class="tips">
    <div class="tips-title">كيف يعمل</div>
    <div class="tip"><div class="tip-dot"></div>أدخل اسمك حتى يعرف لوحة التحكم من أرسل المقطع</div>
    <div class="tip"><div class="tip-dot"></div>اضغط تسجيل — يتوقف تلقائياً بعد ١٠ ثوانٍ</div>
    <div class="tip"><div class="tip-dot"></div>يُرسَل المقطع تلقائياً، وسيظهر في اللوحة فوراً</div>
    <div class="tip"><div class="tip-dot"></div>يمكن لمئات الأشخاص التسجيل في نفس الوقت</div>
  </div>

</main>

<div class="toast" id="toast"></div>

<script>
// =========================================================
// CONFIG — استبدل برابط ngrok الخاص بك
// =========================================================
var SERVER_URL = "https://candy-stardust-kilt.ngrok-free.dev";
// =========================================================

// ── Fixed settings ─────────────────────────────────────────────────────────
var VIDEO_BITRATE = 1500000; // 1.5 Mbps — عالية دائماً
var MAX_DURATION = 10;       // 10 ثوانٍ دائماً
var CIRCUMFERENCE = 2 * Math.PI * 40;

var stream = null;
var mediaRecorder = null;
var chunks = [];
var countdownTimer = null;
var facingMode = "user";
var isRecording = false;
var uploadRetries = 0;
var MAX_RETRIES = 4;
var currentBlob = null;
var currentMime = "";
var currentSender = "";

// ── Boot ───────────────────────────────────────────────────────────────────
window.addEventListener("load", function() {
  var saved = localStorage.getItem("vidstream_name");
  if (saved) document.getElementById("senderName").value = saved;
  checkServer();
  startCamera();
  // Keep-alive check every 20s
  setInterval(checkServer, 20000);
});

// ── Server health check ────────────────────────────────────────────────────
function checkServer() {
  var el = document.getElementById("connStatus");
  el.textContent = "يتحقق…";
  el.className = "";
  fetch(SERVER_URL + "/health", { signal: AbortSignal.timeout(6000) })
    .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
    .then(function(data) {
      el.textContent = "متصل";
      el.className = "ok";
    })
    .catch(function() {
      // fallback to /videos
      return fetch(SERVER_URL + "/videos", { signal: AbortSignal.timeout(6000) })
        .then(function(r) {
          if (r.ok) { el.textContent = "متصل"; el.className = "ok"; }
          else throw new Error();
        })
        .catch(function() {
          el.textContent = "السيرفر غير متاح";
          el.className = "err";
        });
    });
}

// ── Camera ─────────────────────────────────────────────────────────────────
function startCamera() {
  if (stream) stream.getTracks().forEach(function(t) { t.stop(); });

  navigator.mediaDevices.getUserMedia({
    video: { facingMode: facingMode, width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  }).then(function(s) {
    stream = s;
    var preview = document.getElementById("preview");
    preview.srcObject = stream;
    
    // تحديث الكلاس بناءً على نوع الكاميرا المستخدمة حالياً
    preview.className = facingMode; 
    
    document.getElementById("noCam").style.display = "none";
    setStatus("الكاميرا جاهزة");
  }).catch(function(err) {
    setStatus("تعذّر الوصول للكاميرا");
    showToast("لم يُسمح بالوصول للكاميرا", "error");
  });
}

function switchCamera() {
  facingMode = facingMode === "user" ? "environment" : "user";
  startCamera();
  showToast(facingMode === "user" ? "الكاميرا الأمامية" : "الكاميرا الخلفية", "info");
}

// ── Recording ──────────────────────────────────────────────────────────────
function getBestMime() {
  var types = [
    "video/webm;codecs=vp9,opus",
    "video/webm;codecs=vp8,opus",
    "video/webm",
    "video/mp4"
  ];
  for (var i = 0; i < types.length; i++) {
    if (MediaRecorder.isTypeSupported(types[i])) return types[i];
  }
  return "";
}

function startRecording() {
  if (isRecording) return;
  if (!stream) {
    startCamera();
    showToast("جارٍ تشغيل الكاميرا، حاول مجدداً", "error");
    return;
  }

  var name = document.getElementById("senderName").value.trim() || "مجهول";
  localStorage.setItem("vidstream_name", name);
  currentSender = name;

  isRecording = true;
  uploadRetries = 0;
  chunks = [];

  var mimeType = getBestMime();
  currentMime = mimeType || "video/webm";

  var options = { videoBitsPerSecond: VIDEO_BITRATE };
  if (mimeType) options.mimeType = mimeType;

  try {
    mediaRecorder = new MediaRecorder(stream, options);
  } catch(e) {
    mediaRecorder = new MediaRecorder(stream);
    currentMime = "video/webm";
  }

  mediaRecorder.ondataavailable = function(e) {
    if (e.data && e.data.size > 0) chunks.push(e.data);
  };

  mediaRecorder.onstop = function() {
    currentBlob = new Blob(chunks, { type: currentMime });
    uploadVideo();
  };

  // Collect every 500ms for smoother data
  mediaRecorder.start(500);

  var btn = document.getElementById("recordBtn");
  btn.disabled = true;
  btn.textContent = "جارٍ التسجيل…";
  document.getElementById("ringWrap").classList.add("active");
  startCountdown();
}

function startCountdown() {
  var remaining = MAX_DURATION;
  var numEl = document.getElementById("ringNum");
  var fillEl = document.getElementById("ringFill");
  fillEl.style.strokeDashoffset = 0;

  function tick() {
    numEl.textContent = remaining;
    var progress = (MAX_DURATION - remaining) / MAX_DURATION;
    fillEl.style.strokeDashoffset = CIRCUMFERENCE * progress;
    setStatus("جارٍ التسجيل… " + remaining + " ث");
    if (remaining <= 0) { stopRecording(); return; }
    remaining--;
    countdownTimer = setTimeout(tick, 1000);
  }
  tick();
}

function stopRecording() {
  clearTimeout(countdownTimer);
  if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
  document.getElementById("ringWrap").classList.remove("active");
  document.getElementById("recordBtn").textContent = "جارٍ الرفع…";
  setStatus("جارٍ الإرسال…");
}

// ── Upload with retry ──────────────────────────────────────────────────────
function uploadVideo() {
  var bar = document.getElementById("uploadBar");
  var fill = document.getElementById("uploadFill");
  var retryInfo = document.getElementById("retryInfo");

  bar.classList.remove("retry");
  bar.classList.add("active");
  retryInfo.classList.remove("show");

  var xhr = new XMLHttpRequest();
  xhr.open("POST", SERVER_URL + "/upload");

  // Encode sender name safely
  try {
    xhr.setRequestHeader("X-Sender-Name", encodeURIComponent(currentSender));
  } catch(e) {
    xhr.setRequestHeader("X-Sender-Name", "مستخدم");
  }
  xhr.setRequestHeader("X-Mime-Type", currentMime);
  xhr.setRequestHeader("Content-Type", "application/octet-stream");

  // Timeout scales with file size: min 15s, max 120s
  var timeoutMs = Math.max(15000, Math.min(120000, currentBlob.size / 5000));
  var uploadTimeout = setTimeout(function() {
    xhr.abort();
  }, timeoutMs);

  xhr.upload.onprogress = function(e) {
    if (e.lengthComputable) {
      fill.style.width = ((e.loaded / e.total) * 100) + "%";
    }
  };

  xhr.onload = function() {
    clearTimeout(uploadTimeout);
    bar.classList.remove("active", "retry");
    fill.style.width = "0%";
    retryInfo.classList.remove("show");

    isRecording = false;
    resetRecordBtn();

    if (xhr.status === 200) {
      setStatus("تم الإرسال! ✓");
      showToast("✓ تم إرسال المقطع!", "success");
    } else {
      setStatus("فشل الرفع");
      showToast("فشل الرفع — كود: " + xhr.status, "error");
    }
    setTimeout(function() { setStatus("الكاميرا جاهزة"); }, 3500);
  };

  xhr.onerror = xhr.onabort = function() {
    clearTimeout(uploadTimeout);
    uploadRetries++;

    if (uploadRetries <= MAX_RETRIES) {
      var delay = Math.pow(2, uploadRetries) * 1000; // 2s, 4s, 8s, 16s
      var attempt = uploadRetries;
      var maxAttempts = MAX_RETRIES;

      bar.classList.add("retry");
      retryInfo.classList.add("show");
      document.getElementById("retryText").textContent =
        "إعادة المحاولة " + attempt + "/" + maxAttempts + " بعد " + (delay/1000) + " ث…";
      setStatus("إعادة الاتصال…");

      setTimeout(function() {
        fill.style.width = "0%";
        uploadVideo();
      }, delay);
    } else {
      // Give up
      bar.classList.remove("active", "retry");
      fill.style.width = "0%";
      retryInfo.classList.remove("show");
      isRecording = false;
      resetRecordBtn();
      setStatus("فشل الإرسال");
      showToast("تعذّر الإرسال — تحقق من الاتصال", "error");
    }
  };

  xhr.send(currentBlob);
}

function resetRecordBtn() {
  var btn = document.getElementById("recordBtn");
  btn.disabled = false;
  btn.textContent = "⏺ تسجيل ١٠ ث";
}

// ── Helpers ────────────────────────────────────────────────────────────────
function setStatus(text) {
  document.getElementById("statusText").textContent = text;
}

var toastTimer = null;
function showToast(msg, type) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast " + (type || "") + " show";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() {
    t.className = "toast " + (type || "");
  }, 3500);
}

// Prevent accidental page reload while recording
window.addEventListener("beforeunload", function(e) {
  if (isRecording) {
    e.preventDefault();
    e.returnValue = "التسجيل جارٍ، هل تريد المغادرة؟";
  }
});
</script>
</body>
</html>
