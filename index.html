<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فيد ستريم — تسجيل</title>
<style>
:root { --bg: #080810; --card: #10101c; --accent: #ff3c5f; --green: #00e5a0; --text: #eeeef8; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg); color:var(--text); font-family:'Tajawal',sans-serif; min-height:100svh; display:flex; flex-direction:column; align-items:center; }
header { width:100%; max-width:480px; padding:18px 20px; display:flex; justify-content:space-between; }
.logo { font-family:'Bebas Neue',sans-serif; font-size:22px; letter-spacing:4px; background:linear-gradient(90deg,var(--accent),#ff8c42); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
.camera-shell { width:100%; max-width:480px; aspect-ratio:9/16; border-radius:20px; overflow:hidden; background:var(--card); margin:10px 0; }
#preview { width:100%; height:100%; object-fit:cover; }
.controls { width:100%; max-width:480px; padding:0 14px 40px; display:flex; gap:10px; }
.btn-record { flex:1; height:58px; border:none; border-radius:16px; background:linear-gradient(135deg,var(--accent),#c0283f); color:#fff; font-family:'Tajawal',sans-serif; font-size:19px; font-weight:700; cursor:pointer; }
.btn-record:disabled { opacity:0.45; cursor:not-allowed; }
.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px); background:var(--card); border:1px solid #1c1c2e; border-radius:14px; padding:12px 20px; font-size:14px; opacity:0; transition:all 0.3s; z-index:200; }
.toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
.toast.success { border-color:var(--green); color:var(--green); }
</style>
</head>
<body>
<header>
  <span class="logo">VIDSTREAM</span>
  <span style="font-size:11px; border:1px solid #1c1c2e; padding:4px 12px; border-radius:99px; color:#4a4a64;">تسجيل</span>
</header>
<div class="camera-shell">
  <video id="preview" autoplay muted playsinline></video>
</div>
<div class="controls">
  <button class="btn-record" id="recordBtn" onclick="startRecording()">⏺ تسجيل ١٠ ث</button>
</div>
<div class="toast" id="toast"></div>
<script>
var SERVER_URL = "https://candy-stardust-kilt.ngrok-free.dev"; // Auto-detect server URL
var stream = null, mediaRecorder = null, chunks = [], isRecording = false;
// Start camera
navigator.mediaDevices.getUserMedia({ video:true, audio:true }).then(s => {
  stream = s; document.getElementById("preview").srcObject = stream;
}).catch(() => showToast("تعذر الوصول للكاميرا", "error"));
// Start recording
function startRecording() {
  if (isRecording) return;
  isRecording = true;
  chunks = [];
  const mimeType = MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus") ? "video/webm;codecs=vp9,opus" : "video/webm";
  mediaRecorder = new MediaRecorder(stream, { mimeType });
  mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const blob = new Blob(chunks, { type: mimeType });
    const sender = prompt("أدخل اسمك:") || "مجهول";
    const xhr = new XMLHttpRequest();
    xhr.open("POST", SERVER_URL + "/upload");
    xhr.setRequestHeader("X-Sender-Name", encodeURIComponent(sender));
    xhr.setRequestHeader("X-Mime-Type", mimeType);
    xhr.onload = () => showToast("✓ تم إرسال المقطع!", "success");
    xhr.onerror = () => showToast("فشل الإرسال", "error");
    xhr.send(blob);
    isRecording = false;
    document.getElementById("recordBtn").disabled = false;
  };
  mediaRecorder.start();
  document.getElementById("recordBtn").disabled = true;
  document.getElementById("recordBtn").textContent = "جارٍ التسجيل…";
  setTimeout(() => { mediaRecorder.stop(); document.getElementById("recordBtn").textContent = "⏺ تسجيل ١٠ ث"; }, 10000);
}
function showToast(msg, type) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.className = `toast ${type} show`;
  setTimeout(() => t.className = `toast ${type}`, 3500);
}
</script>
</body>
</html>
